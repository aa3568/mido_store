<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pixel-envelope-container" id="envelopeCard" onclick="openEnvelope()">
        <div class="pixel-envelope"></div>
        <p class="pixel-text">Click To Open!</p>
    </div>

    <div class="main-card hidden" id="mainCard">
        
        <div class="media-container">
            <img src="https://media.tenor.com/8-l6p8OipP0AAAAi/cat-pixel.gif" id="catImage" alt="Pixel Cat">
            <img src="https://media.tenor.com/wP0c3Fw8y0cAAAAi/pixel-heart.gif" id="heartImage" alt="Pixel Heart">
        </div>

        <h1 class="pixel-title" id="questionText">DO YOU LOVE ME?</h1>

        <div class="buttons-container" id="buttonsContainer">
            <button class="pixel-btn yes-btn" id="yesBtn" onclick="handleYes()">YES</button>
            <button class="pixel-btn no-btn" id="noBtn">NO</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
