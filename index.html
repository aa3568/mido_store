<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Love ❤️</title>
    <!-- استدعاء خط البيكسل -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة Font Awesome للقطة والقلب -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pixel-envelope-container" id="envelopeCard" onclick="openEnvelope()">
        <div class="pixel-envelope"></div>
        <p class="pixel-text">Click To Open!</p>
    </div>

    <div class="main-card hidden" id="mainCard">
        
        <!-- القطة والقلب من مكتبة CSS -->
        <div class="media-container">
            <i class="fa-solid fa-cat" id="catIcon"></i>
            <i class="fa-solid fa-heart" id="heartIcon"></i>
        </div>

        <h1 class="pixel-title" id="questionText">DO YOU LOVE ME?</h1>

        <div class="buttons-container" id="buttonsContainer">
            <button class="pixel-btn yes-btn" id="yesBtn" onclick="handleYes()">YES</button>
            <button class="pixel-btn no-btn" id="noBtn">NO</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
