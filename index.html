<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-hearts" id="bgHearts"></div>

    <div class="envelope-card" id="envelopeCard" onclick="openEnvelope()">
        <div class="envelope-icon">✉️</div>
        <h2>عندك رسالة جديدة!</h2>
        <p>اضغطي هنا عشان تفتحيها ❤️</p>
    </div>

    <div class="main-card hidden" id="mainCard">
        
        <div class="cat-box" id="catBox">
            <span class="cat-emoji" id="catEmoji">🐱💖</span>
        </div>

        <h1 id="questionText">Do You Love Me? 🥺</h1>

        <div class="buttons-container" id="buttonsContainer">
            <button class="btn yes-btn" id="yesBtn" onclick="handleYes()">Yes! 🥰</button>
            <button class="btn no-btn" id="noBtn">No 😜</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
